plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // The MIT-licensed Combat 1.0.0 JAR is used as the binary baseline while
    // Chill Zone progressively ports/replaces its classes with maintained source.
    compileOnly files('libs/original-combat-1.0.0.jar')
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Produce ONE server mod JAR. It starts with the original MIT Combat JAR,
// replaces the classes/resources we now own in source, and adds Chill Zone code.
tasks.register('forkJar', Jar) {
    dependsOn tasks.named('remapJar')
    archiveBaseName = 'chill-zone-combat'
    archiveVersion = project.version
    destinationDirectory = layout.buildDirectory.dir('fork-libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Keep the original GUI/combat implementation for features not ported yet.
    from(zipTree('libs/original-combat-1.0.0.jar')) {
        exclude 'fabric.mod.json'
        exclude 'META-INF/MANIFEST.MF'
        // Phase 1 replaces the old 20-heart / permanent potion-effect mixin.
        exclude 'com/combat/mixin/LivingEntityMixin.class'
    }

    // Our remapped classes/resources take priority for everything we replace.
    from(zipTree(tasks.named('remapJar').get().archiveFile)) {
        exclude 'META-INF/MANIFEST.MF'
    }

    manifest {
        attributes(
            'Manifest-Version': '1.0',
            'Fabric-Mapping-Namespace': 'official',
            'Implementation-Title': 'Chill Zone Combat',
            'Implementation-Version': project.version
        )
    }
}

tasks.named('build') {
    dependsOn tasks.named('forkJar')
}
